<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Table Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        body {
            background-color: #f4f7f6;
        }
    </style>
</head>
<body class="text-gray-700 font-sans antialiased">

    <div class="max-w-5xl mx-auto px-4 py-10">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-bold text-slate-800 tracking-tight">Excel Table Generator</h1>
            <p class="text-slate-500 mt-2">Buat tabel Excel otomatis pas ukuran kertas tanpa ribet.</p>
            <p class="text-slate-500 mt-2">Made With ❤ By Rakarmp</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-5">
                <div>
                    <h2 class="text-lg font-semibold text-slate-800 mb-2">Kostumisasi</h2>
                    <hr class="border-slate-100">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Judul Utama Laporan</label>
                    <input type="text" id="mainTitle" value="LAPORAN BULANAN PERUSAHAAN" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Sub-Judul / Periode</label>
                    <input type="text" id="subTitle" value="Periode: Mei 2026" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Nama Pembuat / Instansi</label>
                    <input type="text" id="creatorName" value="AR KIDS" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm">
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Ukuran Kertas</label>
                        <select id="paperSize" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/20 text-sm bg-white">
                            <option value="9">A4</option>
                            <option value="1">Letter</option>
                            <option value="5">Legal</option>
                            <option value="8">A3</option>
                        </select>
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Orientasi</label>
                        <select id="orientation" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/20 text-sm bg-white">
                            <option value="portrait">Portrait</option>
                            <option value="landscape">Landscape</option>
                        </select>
                    </div>
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Nama Kolom (Pisah dengan koma)</label>
                    <input type="text" id="columnInputs" value="No, Tanggal, Nama Barang, Jumlah, Harga Satuan, Total" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/20 text-sm">
                </div>

                <div class="space-y-1">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Jumlah Baris Tabel</label>
                    <input type="number" id="rowCountInput" value="5" min="1" max="100" class="w-full px-3 py-2 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500/20 text-sm">
                </div>

                <button onclick="generateTableStructure()" class="w-full bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium py-2.5 rounded-lg transition-colors tracking-wide uppercase">
                    Perbarui Struktur Tabel
                </button>

                <button onclick="exportToExcel()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-medium py-2.5 rounded-lg transition-colors shadow-sm shadow-emerald-500/20 flex items-center justify-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                    Unduh File Excel
                </button>
            </div>

            <div class="lg:col-span-2 flex flex-col space-y-4">
                <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex-1 flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-lg font-semibold text-slate-800">Preview & Isi Data</h2>
                        <button onclick="addNewSingleRow()" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-sm font-medium px-4 py-2 rounded-lg transition-colors">
                            + 1 Baris
                        </button>
                    </div>

                    <div class="overflow-x-auto border border-slate-100 rounded-xl p-4 bg-slate-50 flex-1">
                        <div class="min-w-[600px] bg-white p-6 shadow-sm rounded-lg border border-slate-200">
                            <div class="text-center mb-4">
                                <h3 id="previewMainTitle" class="text-xl font-bold text-slate-800 uppercase"></h3>
                                <p id="previewSubTitle" class="text-xs text-slate-500 mt-1"></p>
                            </div>

                            <div class="text-xs text-slate-600 mb-4 bg-slate-50 p-2.5 rounded border border-dashed border-slate-200 w-fit min-w-[200px]">
                                <div class="flex"><span class="font-semibold text-slate-500">Oleh:</span> <span id="previewCreatorName" class="ml-1 font-medium text-slate-800"></span></div>
                            </div>

                            <table class="w-full text-sm border-collapse border border-slate-300">
                                <thead id="tableHeader" class="bg-slate-100 text-slate-700 font-semibold"></thead>
                                <tbody id="tableBody" class="divide-y divide-slate-200"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let columns = [];
        
        // Sinkronisasi input teks ke tampilan preview secara Real-time
        const inputs = ['mainTitle', 'subTitle', 'creatorName'];
        inputs.forEach(id => {
            const inputEl = document.getElementById(id);
            const previewEl = document.getElementById('preview' + id.charAt(0).toUpperCase() + id.slice(1));
            if(previewEl) previewEl.innerText = inputEl.value;
            inputEl.addEventListener('input', () => {
                if(previewEl) previewEl.innerText = inputEl.value;
            });
        });

        // Tampilkan info kertas di preview secara real-time
        document.getElementById('paperSize').addEventListener('change', (e) => {
            document.getElementById('previewPaper').innerText = e.target.options[e.target.selectedIndex].text;
        });
        document.getElementById('orientation').addEventListener('change', (e) => {
            document.getElementById('previewOrient').innerText = e.target.options[e.target.selectedIndex].text;
        });

        // Fungsi membuat struktur kolom & jumlah baris sekaligus
        function generateTableStructure() {
            const rawColumns = document.getElementById('columnInputs').value;
            columns = rawColumns.split(',').map(col => col.trim()).filter(col => col !== "");
            
            // Render Header
            const thead = document.getElementById('tableHeader');
            thead.innerHTML = '';
            let tr = document.createElement('tr');
            columns.forEach(col => {
                let th = document.createElement('th');
                th.className = "border border-slate-300 px-3 py-2 text-left font-medium text-xs text-slate-600 tracking-wider uppercase";
                th.innerText = col;
                tr.appendChild(th);
            });
            thead.appendChild(tr);

            // Buat baris sebanyak angka yang diinput user
            document.getElementById('tableBody').innerHTML = '';
            const desiredRows = parseInt(document.getElementById('rowCountInput').value) || 1;
            for(let i = 0; i < desiredRows; i++) {
                addNewSingleRow();
            }
        }

        // Fungsi bantu nambah 1 baris ke tabel
        function addNewSingleRow() {
            const tbody = document.getElementById('tableBody');
            const tr = document.createElement('tr');
            tr.className = "hover:bg-slate-50/50 transition-colors";
            
            columns.forEach(() => {
                let td = document.createElement('td');
                td.className = "border border-slate-200 p-1";
                let input = document.createElement('input');
                input.type = "text";
                input.className = "w-full px-2 py-1 text-sm border-0 focus:bg-white focus:ring-2 focus:ring-indigo-500 rounded bg-transparent outline-none";
                td.appendChild(input);
                tr.appendChild(td);
            });
            tbody.appendChild(tr);
        }

        // Fungsi Ekspor Excel dengan Print Setup Otomatis
        function exportToExcel() {
            const mainTitle = document.getElementById('mainTitle').value;
            const subTitle = document.getElementById('subTitle').value;
            const creatorName = document.getElementById('creatorName').value;
            const paperCode = parseInt(document.getElementById('paperSize').value);
            const orientationVal = document.getElementById('orientation').value;

            const excelData = [];
            excelData.push([mainTitle.toUpperCase()]);
            excelData.push([subTitle]);
            excelData.push([]);
            excelData.push(["Oleh: " + creatorName]);
            excelData.push([]);
            excelData.push(columns);

            // Mengambil inputan
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                const rowData = [];
                const rowInputs = row.querySelectorAll('input');
                rowInputs.forEach(input => {
                    const val = input.value;
                    rowData.push(isNaN(val) || val === '' ? val : Number(val));
                });
                excelData.push(rowData);
            });

            const worksheet = XLSX.utils.aoa_to_sheet(excelData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Laporan");

            // 1. MERGE HEADER AGAR RAPI
            if(columns.length > 1) {
                worksheet['!merges'] = [
                    { s: { r: 0, c: 0 }, e: { r: 0, c: columns.length - 1 } }, 
                    { s: { r: 1, c: 0 }, e: { r: 1, c: columns.length - 1 } }
                ];
            }

            // 2. AUTO-FIT LEBAR KOLOM (Agar pas lebar teks dan tidak terpotong)
            const maxCols = columns.length;
            const colWidths = [];
            for (let c = 0; c < maxCols; c++) {
                colWidths.push({ wch: 15 }); // Lebar default aman awal
            }
            worksheet['!cols'] = colWidths;

            // 3. PENGATURAN KERTAS & CETAK OTOMATIS (Page Setup)
            // Menggunakan properti !pageSetup agar saat di-print/PDF langsung muat 1 halaman lebar kustom
            worksheet['!pageSetup'] = {
                paperSize: paperCode, // 9 = A4, 1 = Letter, 5 = Legal
                orientation: orientationVal, // 'portrait' atau 'landscape'
                fitToPage: true, // Otomatis mengecilkan/memasukkan tabel ke area cetak kertas
                fitToWidth: 1,   // Kunci lebar tabel agar pas 1 halaman lebar kertas (tidak terpotong ke kanan)
                fitToHeight: 0   // Biarkan baris memanjang ke bawah secara alami jika datanya banyak
            };

            // Download file
            const fileName = mainTitle.toLowerCase().replace(/[^a-z0-9]/g, '_') + "_export.xlsx";
            XLSX.writeFile(workbook, fileName);
        }

        window.onload = function() {
            generateTableStructure();
        };
    </script>
</body>
</html>
